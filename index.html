<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta -->
    <title>To-Do · Life Tracker — Smart Task & Schedule Planner</title>
    <meta name="description" content="To-Do Life Tracker is a free, beautifully designed task manager and daily planner. Organize your tasks by category, set due dates, track priorities, and stay on top of your life — all in one place." />
    <meta name="keywords" content="to-do list, life tracker, task manager, daily planner, schedule planner, productivity app, task tracker, to do app, free task manager, habit tracker" />
    <meta name="author" content="Life Tracker" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://lifetrack.vercel.app/" />

    <!-- Theme Color — neutral surface, pink accent shows in browser chrome -->
    <meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph (Facebook / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="To-Do · Life Tracker" />
    <meta property="og:title" content="To-Do · Life Tracker — Smart Task & Schedule Planner" />
    <meta property="og:description" content="Free, beautifully designed task manager. Organize tasks by category, set due dates, track priorities, and stay on top of your life — all in one place." />
    <meta property="og:url" content="https://lifetrack.vercel.app/" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="To-Do · Life Tracker — Smart Task & Schedule Planner" />
    <meta name="twitter:description" content="Free, beautifully designed task manager. Organize tasks by category, set due dates, track priorities, and stay on top of your life." />

    <!-- Structured Data — SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "To-Do · Life Tracker",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "Web, Android, iOS",
      "description": "A free, beautifully designed to-do list and life planner. Organize tasks with categories, due dates, and priority tracking.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Smart task views: Today, Upcoming, Overdue, Priority",
        "Custom categories with color themes",
        "Due date calendar picker",
        "Dark mode support",
        "Responsive for mobile, tablet, and desktop"
      ]
    }
    </script>

    <!-- Favicon — pink rounded checkmark -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23b5295e'/%3E%3Cpath d='M20 33l8 8 16-18' fill='none' stroke='%23ffffff' stroke-width='5.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />

    <!-- Google Fonts — Nunito (display) + Inter (body) + JetBrains Mono (tabular) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
